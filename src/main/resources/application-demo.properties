# Demo profile: MySQL 없이 H2 인메모리로 실행
# 실행: ./gradlew bootRun --args="--spring.profiles.active=demo"
# API 문서: http://localhost:8080/scalar
# 테스트 토큰: http://localhost:8080/demo/access-token

spring.datasource.url=jdbc:h2:mem:pm11demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

pm11.auth.google.web-client-id=

springdoc.swagger-ui.enabled=false
